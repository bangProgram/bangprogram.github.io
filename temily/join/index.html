<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테밀리 클럽 초대</title>
  <meta name="description" content="테밀리(Temily) 테니스 클럽에 초대되었습니다. 앱을 설치하고 초대 코드로 바로 가입하세요." />
  <!--
    ⚙️ 설정값 — 스토어 URL.
    - Android: Play Store 패키지 com.temily.temily
    - iOS: 앱 출시 후 App Store 숫자 ID 로 교체 필요 (현재 검색 URL 폴백)
  -->
  <style>
    :root {
      --lime: #7BC74A;
      --sky: #4AC1E0;
      --ink: #1a1f1a;
      --muted: #6b766b;
      --bg: #f6faf3;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: 24px;
      padding: 36px 28px 32px;
      box-shadow: 0 12px 40px rgba(40, 90, 30, 0.10);
      text-align: center;
    }
    .logo {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      margin: 0 auto 20px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--lime), var(--sky)); /* 이미지 로드 전 배경 */
      box-shadow: 0 8px 20px rgba(123, 199, 74, 0.35);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand { font-size: 15px; font-weight: 700; color: var(--lime); letter-spacing: 0.5px; margin-bottom: 6px; }
    h1 { font-size: 22px; line-height: 1.4; margin-bottom: 10px; }
    p.sub { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    .code-box {
      background: linear-gradient(135deg, rgba(123,199,74,0.10), rgba(74,193,224,0.10));
      border: 1.5px solid rgba(123,199,74,0.35);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .code-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .code-value { font-size: 28px; font-weight: 800; letter-spacing: 6px; color: #3a8f1f; }
    .code-value.empty { font-size: 15px; letter-spacing: 0; color: var(--muted); font-weight: 500; }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 12px;
      border: none;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.2s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--lime), var(--sky));
      color: #fff;
      box-shadow: 0 8px 18px rgba(123, 199, 74, 0.3);
    }
    .btn-ghost {
      background: #f0f4ef;
      color: var(--ink);
    }
    .hint { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.6; }
    .platform { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><img id="logoImg" src="temily-icon.png" alt="테밀리" /></div>
    <div class="brand">TEMILY · 테밀리</div>
    <h1 id="title">테니스 클럽에<br />초대되었습니다</h1>
    <p class="sub">앱을 설치하면 아래 초대 코드로 바로 가입할 수 있어요.</p>

    <div class="code-box">
      <div class="code-label">초대 코드</div>
      <div id="code" class="code-value empty">앱에서 확인</div>
    </div>

    <a id="openApp" class="btn btn-ghost" href="#">앱에서 열기</a>
    <a id="storeBtn" class="btn btn-primary" href="#">앱 설치하기</a>

    <p class="hint">
      앱이 이미 설치되어 있다면 링크가 자동으로 앱에서 열립니다.<br />
      열리지 않으면 “앱에서 열기”를 눌러주세요.
    </p>
  </main>

  <script>
    // ── 스토어 URL ──
    var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.temily.temily';
    // iOS: App Store 출시 후 숫자 ID 로 교체 (예: https://apps.apple.com/app/id1234567890)
    var APPSTORE_URL = 'https://apps.apple.com/kr/app/temily/id0000000000';

    var params = new URLSearchParams(window.location.search);
    var code = (params.get('code') || '').trim().toUpperCase();

    if (code) {
      var el = document.getElementById('code');
      el.textContent = code;
      el.classList.remove('empty');
    }

    // ── 클럽 아이콘 동적 로드 ──
    //  초대 코드로 클럽을 익명 조회(anon key, RLS clubs_select_public 허용).
    //  커버 이미지가 있으면 로고로 교체, 없거나 실패하면 기본 테밀리 아이콘 유지.
    var SUPABASE_URL = 'https://eedzqqexhiysfphwmbkm.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlZHpxcWV4aGl5c2ZwaHdtYmttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwODQ1MzYsImV4cCI6MjA5MTY2MDUzNn0.fvG7LWS6jaAZUBdBFOFQEiKqggKQJtPKA-5cNQ3myOU';

    if (code) {
      fetch(
        SUPABASE_URL + '/rest/v1/clubs?invite_code=eq.' + encodeURIComponent(code) +
        '&select=name,image_url&limit=1',
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY } }
      )
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        var club = rows && rows[0];
        if (!club) return;
        // 클럽명 → 제목 ("○○에 초대되었습니다")
        if (club.name) {
          var safe = document.createElement('div');
          safe.textContent = club.name;
          document.getElementById('title').innerHTML = safe.innerHTML + '에<br />초대되었습니다';
        }
        // 커버 이미지 → 로고 (없으면 기본 테밀리 아이콘 유지)
        if (club.image_url) {
          var img = document.getElementById('logoImg');
          // 클럽 이미지 로드 실패 시 테밀리 아이콘으로 복귀
          img.onerror = function () { img.onerror = null; img.src = 'temily-icon.png'; };
          img.src = club.image_url;
        }
      })
      .catch(function () { /* 네트워크 실패 → 기본 테밀리 아이콘 유지 */ });
    }

    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua);
    var isAndroid = /Android/.test(ua);

    // 설치 버튼 → 플랫폼별 스토어
    var storeBtn = document.getElementById('storeBtn');
    storeBtn.href = isIOS ? APPSTORE_URL : PLAY_URL;

    // 앱에서 열기 → 커스텀 스킴 폴백 (Universal/App Link 로 안 열린 경우 수동 시도)
    var openApp = document.getElementById('openApp');
    openApp.href = 'com.temily.temily://join?code=' + encodeURIComponent(code);
  </script>
</body>
</html>
